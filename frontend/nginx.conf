# Serves the built SPA and proxies /api to the backend container.
# TLS is terminated upstream (the host's nginx + certificate), so this listens
# on plain HTTP inside the compose network only.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the content-hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # リアルタイム更新（Server-Sent Events）。応答を溜め込まずに流し、つないだまま
    # にしておく。バックエンドは20秒ごとに空行を送るので、読み取りのタイムアウトは
    # それより長ければよい。
    location = /api/events {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # 外側（ホストの nginx 等）にも「溜め込まないで」と伝える。バックエンドが付けた
        # X-Accel-Buffering はこの nginx が消費して外へは渡さないので、付け直す。
        add_header X-Accel-Buffering no;
    }

    # API → backend service on the compose network.
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
